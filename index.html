<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Diari Kasturi">
<meta name="theme-color" content="#fff7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1417" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Diari Kasturi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: one phone column on handmade paper — title row, one view per tab (plates, journal pages, photo calendar, "kita" hub), floating five-slot pill tab bar. */
:root{
  --bg:#fff7f8; --ink:#2e1a1e; --ink-2:#8a6d73; --chip:#fbe9ee; --chip-on:#f3d0da;
  --line:#f2dde3; --accent:#6e3a46; --accent-ink:#fff7f8; --sheet:#fffbfc; --card:#ffffff;
  --danger:#a8323a; --rose:#d4607a; --rose-soft:rgba(212,96,122,.2); --sage:#6f9467;
  --plate-shadow:rgba(120,60,75,.16); --scrim:rgba(60,25,35,.35);
  --paper:var(--paper-l);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-hand:"Caveat", "Bradley Hand", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1e1417; --ink:#f7e6ea; --ink-2:#c09ea6; --chip:#2d1f24; --chip-on:#4a3139;
  --line:#3c2a30; --accent:#f0a9b8; --accent-ink:#2a1218; --sheet:#261a1e; --card:#2c1f23;
  --danger:#ef8a8f; --rose:#ec8aa0; --rose-soft:rgba(236,138,160,.25); --sage:#9cc08f;
  --plate-shadow:rgba(0,0,0,.55); --scrim:rgba(0,0,0,.55);
  --paper:var(--paper-d); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1e1417; --ink:#f7e6ea; --ink-2:#c09ea6; --chip:#2d1f24; --chip-on:#4a3139;
  --line:#3c2a30; --accent:#f0a9b8; --accent-ink:#2a1218; --sheet:#261a1e; --card:#2c1f23;
  --danger:#ef8a8f; --rose:#ec8aa0; --rose-soft:rgba(236,138,160,.25); --sage:#9cc08f;
  --plate-shadow:rgba(0,0,0,.55); --scrim:rgba(0,0,0,.55);
  --paper:var(--paper-d); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg); background-image:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:16px; -webkit-tap-highlight-color:transparent}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--accent); outline-offset:2px}
.app{max-width:560px; margin:0 auto; padding-inline:18px; padding-block:18px 150px}

/* header */
.top{display:flex; align-items:center; gap:12px}
.top h1{flex:1; min-width:0; margin:0; font-family:var(--f-display); font-weight:800; font-size:clamp(28px,8.4vw,40px); letter-spacing:-.02em; line-height:1.05; text-wrap:balance; overflow-wrap:anywhere}
.titlebtn{border:0; background:none; padding:0; margin:0; text-align:left; font:inherit; color:inherit; letter-spacing:inherit; line-height:inherit; overflow-wrap:anywhere}
.titlebtn svg{width:.42em; height:.42em; margin-left:.18em; vertical-align:.12em; opacity:.35}
.round{flex:none; width:52px; height:52px; border-radius:50%; border:0; background:var(--chip); display:grid; place-items:center; padding:0; overflow:hidden}
.round svg{width:22px; height:22px}
.avatar img{width:100%; height:100%; object-fit:cover}
.avatar .ini{font-family:var(--f-display); font-weight:800; font-size:20px; color:var(--accent)}
.sub-h{margin:6px 0 0; font-size:14px; color:var(--ink-2)}
.sub-h b{color:var(--rose); font-weight:700}

/* chips */
.chips{display:flex; gap:10px; overflow-x:auto; margin:18px -18px 0; padding:2px 18px 6px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; border:1.5px solid var(--line); background:transparent; border-radius:999px; padding:10px 20px; font-size:16px; color:var(--ink-2); white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--chip-on); border-color:var(--chip-on); color:var(--ink); font-weight:600}
.chip.add{padding:10px 16px; color:var(--accent); font-weight:700}
.wrapchips{display:flex; flex-wrap:wrap; gap:8px}
.wrapchips .chip{padding:8px 15px; font-size:15px}

/* plates grid */
.grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:22px 14px; margin-top:22px}
.cell{border:0; background:none; padding:0; display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0}
.cell .num{font-family:var(--f-display); font-weight:600; font-size:17px; font-variant-numeric:tabular-nums}
.plate{position:relative; width:100%; max-width:100%; aspect-ratio:1; background-size:100% 100%; filter:drop-shadow(0 5px 8px var(--plate-shadow)); transition:transform .15s}
.well{position:absolute; inset:13%; border-radius:50%; overflow:hidden}
.well img{width:100%; height:100%; object-fit:cover; display:block}
.well::after{content:""; position:absolute; inset:0; border-radius:50%; box-shadow:inset 0 2px 7px rgba(40,20,5,.28)}
.cell:active .plate{transform:scale(.96)}
.empty{grid-column:1/-1; text-align:center; color:var(--ink-2); margin:6px 0 0; line-height:1.5}
.ghost .plate{opacity:.55}

/* section titles */
.h2{font-family:var(--f-display); font-weight:800; font-size:22px; margin:28px 0 10px; display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.h2 small{font-family:var(--f-body); font-weight:600; font-size:13px; color:var(--ink-2)}
.h2 .linkbtn{font-size:14px}

/* journal */
.jlist{display:flex; flex-direction:column; gap:18px; margin-top:22px}
.page{position:relative; border:0; width:100%; text-align:left; background:var(--card); border-radius:6px 18px 18px 6px; padding:16px 18px 18px 26px; box-shadow:0 2px 0 var(--line), 0 8px 22px var(--plate-shadow); background-image:repeating-linear-gradient(transparent 0 29px, var(--line) 29px 30px); background-position:0 52px; min-width:0}
.page::before{content:""; position:absolute; left:12px; top:0; bottom:0; width:1.5px; background:var(--rose-soft)}
.page .pd{font-size:12.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.page h3{font-family:var(--f-hand); font-weight:700; font-size:28px; line-height:1.05; margin:6px 0 4px; overflow-wrap:anywhere}
.page p{margin:0; line-height:30px; color:var(--ink); overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}
.page .pol{float:right; width:96px; margin:4px 0 6px 12px; background:#fff; padding:5px 5px 16px; box-shadow:0 3px 10px var(--plate-shadow); transform:rotate(3deg)}
.page .pol img{width:100%; aspect-ratio:1; object-fit:cover; display:block}
.mood{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; letter-spacing:0; text-transform:none; color:var(--ink)}
.mood i{width:9px; height:9px; border-radius:50%; display:inline-block}
.full p{-webkit-line-clamp:unset; display:block; white-space:pre-wrap}
.full .pol{width:46%}

/* calendar */
.cyc{margin-top:20px; border-radius:24px; padding:18px; background:var(--card); box-shadow:0 8px 22px var(--plate-shadow); display:flex; gap:16px; align-items:center}
.cyc .ring{flex:none; width:92px; height:92px}
.cyc .info{flex:1; min-width:0}
.cyc .k{font-size:12.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2)}
.cyc .v{font-family:var(--f-display); font-weight:800; font-size:21px; line-height:1.15; margin:3px 0 4px; text-wrap:balance}
.cyc .s{font-size:13.5px; color:var(--ink-2); line-height:1.4}
.cyc .btns{margin-top:4px}
.mini{border:0; border-radius:999px; padding:8px 14px; font-weight:700; font-size:14px; background:var(--rose); color:#fff; margin-top:10px}
.mini.soft{background:var(--chip); color:var(--ink)}
.calnav{display:flex; align-items:center; justify-content:space-between; margin:26px 0 10px}
.calnav h3{margin:0; font-family:var(--f-display); font-weight:800; font-size:22px}
.calnav button{width:40px; height:40px; border-radius:50%; border:0; background:var(--chip); display:grid; place-items:center}
.calnav svg{width:18px; height:18px}
.cal{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px 4px}
.dow{text-align:center; font-size:12px; font-weight:700; color:var(--ink-2); padding-bottom:4px}
.day{position:relative; border:0; background:none; padding:0; aspect-ratio:1; border-radius:50%; display:grid; place-items:center; font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink); min-width:0}
.day.out{visibility:hidden}
.day img{position:absolute; inset:3px; width:calc(100% - 6px); height:calc(100% - 6px); border-radius:50%; object-fit:cover}
.day.has span{position:relative; z-index:1; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.7)}
.day.per{background:var(--rose-soft)}
.day.per.has::after,.day.pred::after{content:""; position:absolute; inset:0; border-radius:50%; border:2.5px solid var(--rose)}
.day.pred::after{border-style:dashed; border-width:2px}
.day.fert::before{content:""; position:absolute; bottom:1px; left:50%; width:5px; height:5px; margin-left:-2.5px; border-radius:50%; background:var(--sage); z-index:2}
.day.ov::before{width:8px; height:8px; margin-left:-4px; bottom:0}
.day.today{outline:2px solid var(--ink); outline-offset:1px}
.appt{display:flex; align-items:center; gap:12px; width:100%; text-align:left; border:0; background:var(--card); border-radius:16px; padding:12px; box-shadow:0 4px 14px var(--plate-shadow); margin-bottom:10px; min-width:0}
.dbadge{flex:none; width:50px; border-radius:12px; padding:6px 0 5px; text-align:center; background:var(--chip); border-top:4px solid var(--c)}
.dbadge b{display:block; font-family:var(--f-display); font-size:21px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums}
.dbadge span{font-size:11.5px; font-weight:700; color:var(--ink-2); text-transform:uppercase; letter-spacing:.05em}
.appt .txt{flex:1; min-width:0}
.appt .t1{display:block; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.appt .t2{display:block; font-size:13.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.appt .t3{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-2); margin-top:2px}
.appt .t3 i{width:8px; height:8px; border-radius:50%; flex:none}
.rel{flex:none; font-size:12px; font-weight:700; color:var(--ink-2); background:var(--chip); border-radius:999px; padding:4px 9px}
.rel.now{background:var(--rose); color:#fff}
.day .ap{position:absolute; top:2px; right:2px; width:8px; height:8px; border-radius:50%; z-index:3; box-shadow:0 0 0 1.5px var(--bg)}
.chatcard{display:flex; align-items:center; gap:12px; width:100%; text-align:left; border:0; background:var(--accent); color:var(--accent-ink); border-radius:20px; padding:14px 16px; margin-top:22px; box-shadow:0 8px 20px var(--plate-shadow); min-width:0}
.chatcard .nb{flex:none; min-width:24px; height:24px; border-radius:12px; background:var(--rose); color:#fff; font-size:12.5px; font-weight:700; display:grid; place-items:center; padding:0 7px}
.chatcard .cc-ic{flex:none; width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.16); display:grid; place-items:center}
.chatcard .cc-ic svg{width:22px; height:22px}
.chatcard .txt{flex:1; min-width:0}
.chatcard .t1{display:block; font-weight:700}
.chatcard .t2{display:block; font-size:13.5px; opacity:.8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sheet.chat{height:92%; display:flex; flex-direction:column; padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.chat-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding-bottom:8px; border-bottom:1px solid var(--line)}
.chat-head h2{margin:0}
.chatlist{flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding:10px 2px}
.chat-empty{margin:auto; text-align:center; color:var(--ink-2); max-width:30ch; line-height:1.5}
.chat-day{align-self:center; font-size:12px; font-weight:700; color:var(--ink-2); background:var(--chip); border-radius:999px; padding:4px 10px; margin:8px 0 4px}
.bub{max-width:80%; padding:9px 12px 6px; border-radius:18px; display:flex; flex-direction:column; gap:2px}
.bub .bt{white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.4}
.bub .bm{font-size:11px; opacity:.7; align-self:flex-end}
.bub.me{align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:6px}
.bub.them{align-self:flex-start; background:var(--card); box-shadow:0 2px 8px var(--plate-shadow); border-bottom-left-radius:6px}
.bub.pending{opacity:.6}
.quick{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:6px 0}
.quick::-webkit-scrollbar{display:none}
.quick .chip{padding:7px 13px; font-size:14px}
.composer{display:flex; gap:8px; align-items:flex-end}
.composer .inp{flex:1; min-width:0; resize:none; min-height:46px; max-height:120px; border-radius:22px; padding:11px 16px; line-height:1.35}
.send{flex:none; width:46px; height:46px; border-radius:50%; border:0; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center}
.send svg{width:20px; height:20px}
.req{display:flex; align-items:center; gap:12px; width:100%; text-align:left; border:0; background:var(--card); border-radius:16px; padding:12px 14px; box-shadow:0 4px 14px var(--plate-shadow); margin-bottom:10px; min-width:0}
.req .txt{flex:1; min-width:0}
.req .t1{display:block; font-weight:700; overflow-wrap:anywhere}
.req .t2{display:block; font-size:13.5px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.req .t3{display:block; font-size:12px; font-weight:600; color:var(--ink-2)}
.pill{display:inline-block; flex:none; font-size:12px; font-weight:700; color:var(--c); border:1.5px solid var(--c); border-radius:999px; padding:3px 10px; white-space:nowrap}
.legend{display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:14px; font-size:12.5px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:12px; height:12px; border-radius:50%; display:inline-block}

/* kita hub */
.letter{display:flex; align-items:center; gap:14px; width:100%; text-align:left; border:0; background:var(--card); border-radius:16px; padding:14px; box-shadow:0 4px 14px var(--plate-shadow); margin-bottom:10px; min-width:0}
.env{flex:none; width:52px; height:38px; position:relative}
.env svg{width:100%; height:100%}
.letter .txt{flex:1; min-width:0}
.letter .t1,.letter .t2{display:block}
.letter .t1{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.letter .t2{font-size:13px; color:var(--ink-2)}
.dot{flex:none; width:10px; height:10px; border-radius:50%; background:var(--rose)}
.wish{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); min-width:0}
.wish .tick{flex:none; width:28px; height:28px; border-radius:50%; border:2px solid var(--ink-2); background:none; display:grid; place-items:center; padding:0}
.wish .tick svg{width:16px; height:16px; opacity:0}
.wish.done .tick{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.wish.done .tick svg{opacity:1}
.wish .w{flex:1; min-width:0}
.wish .w b{display:block; font-weight:600; overflow-wrap:anywhere}
.wish.done .w b{text-decoration:line-through; color:var(--ink-2)}
.wish .w span{font-size:12.5px; color:var(--ink-2)}
.wish .x{border:0; background:none; color:var(--ink-2); font-size:20px; padding:4px 6px; line-height:1}
.wish .go{border:0; background:var(--chip); border-radius:999px; padding:6px 10px; font-size:13px; font-weight:700; color:var(--accent); flex:none}
.addrow{display:flex; gap:8px; margin-top:8px}
.addrow .inp{flex:1; min-width:0}
.addrow .mini{margin:0; background:var(--accent); color:var(--accent-ink); padding:0 18px}
.recap{border-radius:24px; background:var(--card); padding:16px; box-shadow:0 8px 22px var(--plate-shadow)}
.recap .nav{display:flex; align-items:center; justify-content:space-between; gap:10px}
.recap .nav b{font-family:var(--f-display); font-size:19px}
.recap .nav button{width:36px; height:36px; border-radius:50%; border:0; background:var(--chip); display:grid; place-items:center}
.recap .nav svg{width:16px; height:16px}
.collage{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; margin-top:14px; border-radius:14px; overflow:hidden}
.collage img{width:100%; aspect-ratio:1; object-fit:cover; display:block}
.collage .hero{grid-column:span 2; grid-row:span 2}
.nums{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-top:14px}
.nums div{text-align:center; min-width:0}
.nums b{display:block; font-family:var(--f-display); font-size:24px; font-weight:800; font-variant-numeric:tabular-nums}
.nums span{font-size:12px; color:var(--ink-2)}
.hl{margin:14px 0 0; font-size:14.5px; line-height:1.5}
.hl b{font-weight:700}

/* tab bar */
.tabbar{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom,0px)); width:min(400px, calc(100% - 24px)); height:76px; border-radius:40px; background:var(--chip); display:grid; grid-template-columns:1fr 1fr auto 1fr 1fr; align-items:center; box-shadow:0 10px 30px var(--plate-shadow); z-index:5; padding:0 6px}
.tab{border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:12px; font-weight:600; color:var(--ink-2); position:relative; padding:0}
.tab svg{width:24px; height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab .badge-n{position:absolute; top:-4px; right:calc(50% - 20px); min-width:18px; height:18px; border-radius:9px; background:var(--rose); color:#fff; font-size:11px; font-weight:700; display:grid; place-items:center; padding:0 5px}
.fab{width:70px; height:70px; border-radius:50%; border:0; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; margin:-14px 4px 0; box-shadow:0 6px 16px var(--plate-shadow)}
.fab svg{width:32px; height:32px}

/* sheets */
.scrim{position:fixed; inset:0; background:var(--scrim); z-index:10; display:flex; align-items:flex-end; justify-content:center}
.sheet{width:100%; max-width:560px; max-height:92%; overflow-y:auto; background:var(--sheet); border-radius:28px 28px 0 0; padding-inline:20px; padding-block:12px calc(24px + env(safe-area-inset-bottom,0px)); animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px); opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none} .plate{transition:none}}
.grab{width:44px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 14px}
.sheet h2{font-family:var(--f-display); font-weight:800; font-size:24px; margin:0 0 4px; text-wrap:balance; overflow-wrap:anywhere}
.big{width:min(78%,320px); margin:6px auto 12px}
.pick{display:block; cursor:pointer; position:relative}
.pick input{position:absolute; opacity:0; width:1px; height:1px}
.pick .hint{position:absolute; inset:13%; border-radius:50%; display:grid; place-items:center; text-align:center; font-size:14px; font-weight:600; color:var(--ink-2); padding:12%; border:2px dashed rgba(110,58,70,.35)}
.polpick{display:block; cursor:pointer; width:min(60%,240px); margin:8px auto 4px; background:#fff; padding:8px 8px 26px; box-shadow:0 4px 14px var(--plate-shadow); transform:rotate(-2deg); position:relative}
.polpick input{position:absolute; opacity:0; width:1px; height:1px}
.polpick .ph{aspect-ratio:1; background:#efe9df; display:grid; place-items:center; color:#8a7a6c; font-size:14px; font-weight:600; text-align:center; padding:10px}
.polpick img{width:100%; aspect-ratio:1; object-fit:cover; display:block}
.lbl{display:block; font-size:12.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); margin:16px 0 7px}

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const BLN=["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogo","Sep","Okt","Nov","Dis"];
const BULAN=["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"];
const HARI=["Ahad","Isnin","Selasa","Rabu","Khamis","Jumaat","Sabtu"];

const dnum=s=>{const[y,m,d]=s.split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const diso=n=>new Date(n*864e5).toISOString().slice(0,10);
const fmtDate=s=>{if(!s)return"";const[y,m,d]=s.split("-");return +d+" "+BLN[+m-1]+" "+y};
const fmtShort=s=>{if(!s)return"";const[,m,d]=s.split("-");return +d+" "+BLN[+m-1]};
const fmtLong=s=>{const[y,m,d]=s.split("-").map(Number);return HARI[new Date(y,m-1,d).getDay()]+", "+d+" "+BULAN[m-1]+" "+y};
const monthName=ym=>{const[y,m]=ym.split("-");return BULAN[+m-1]+" "+y};
const shiftMonth=(ym,k)=>{const[y,m]=ym.split("-").map(Number);const d=new Date(y,m-1+k,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
let toastT;function toast(msg){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}

/* ---------- paper texture ---------- */
(function paper(){
  const mk=(col)=>{const c=document.createElement("canvas");c.width=c.height=320;const g=c.getContext("2d");g.strokeStyle=col;g.lineCap="round";
    for(let i=0;i<150;i++){const x=Math.random()*320,y=Math.random()*320,a=Math.random()*6.28,l=4+Math.random()*16;g.lineWidth=.4+Math.random()*.7;g.globalAlpha=.25+Math.random()*.5;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+.6)*l*.6,y+Math.sin(a+.6)*l*.6,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}
    return "url("+c.toDataURL()+")"};
  try{document.documentElement.style.setProperty("--paper-l",mk("rgba(205,120,145,.28)"));document.documentElement.style.setProperty("--paper-d",mk("rgba(255,210,225,.14)"))}catch(e){}
})();

/* ---------- ceramic plates ---------- */
const PLATES=["Titik bata","Kipas merah","Kerang biru","Tulip","Renda hijau","Malam","Jalur biru","Bunga"];
function rng(seed){return()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const PDEF=[["#f3e1d2","#c7765a"],["#f6eee5","#a3313a"],["#f8f7f2","#5578b0"],["#f2d5cb","#c3444b"],["#f6f1e3","#45704f"],["#1d2741","#3e5c9a"],["#f6f4ee","#22407c"],["#f5ead6","#c66a45"]];
const SW_COL=["#a3313a","#c7765a","#c66a45","#d6a03c","#45704f","#7a9a6a","#2f7f86","#3e5c9a","#22407c","#7d4e9e","#d16b8f","#3b2a20"];
const SW_BASE=["#f8f7f2","#f5ead6","#f2d5cb","#f6e7c8","#e6efe4","#e5ebf5","#efe2f0","#1d2741","#2a2420"];
function normPlate(st){
  if(st&&typeof st==="object"){const p=(((st.p|0)%8)+8)%8;return{p,b:st.b||PDEF[p][0],c:st.c||PDEF[p][1]}}

}
const pkey=st=>{const n=normPlate(st);return n.p+n.b+n.c};
const isPreset=st=>{const n=normPlate(st);return n.b===PDEF[n.p][0]&&n.c===PDEF[n.p][1]};
const darkHex=h=>{const n=parseInt(h.slice(1),16);return(0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))<110};
const plateCache={};
function plateBg(st){
  const {p:i,b:base,c:col}=normPlate(st),key=i+base+col;
  if(plateCache[key])return plateCache[key];
  const r=rng(i*97+13),s=[],P=(d,a)=>[(100+d*Math.cos(a)).toFixed(2),(100+d*Math.sin(a)).toFixed(2)];
  const ring=(n,fn,off=0)=>{for(let j=0;j<n;j++)fn(off+j*2*Math.PI/n,j)};
  const C=(x,y,rad,extra)=>`<circle cx="${x}" cy="${y}" r="${rad}" ${extra}/>`;
  const speck=(n,c,op,a0,a1,sz)=>{for(let j=0;j<n;j++){const[x,y]=P(a0+r()*(a1-a0),r()*6.2832);s.push(C(x,y,(sz*(.4+r()*.9)).toFixed(2),`fill="${c}" opacity="${op}"`))}};
  const deg=a=>(a*180/Math.PI).toFixed(1);
  const dk=darkHex(base),spk=dk?"#ffffff":col,edge=dk?"rgba(255,255,255,.18)":"rgba(60,40,20,.13)";
  switch(i){
    case 0: s.push(C(100,100,97,`fill="${base}"`)); speck(60,spk,dk?.5:.28,76,96,1);
      ring(12,a=>{const[x,y]=P(87,a);s.push(C(x,y,6.8,`fill="${col}" opacity=".92"`))}); break;
    case 1: s.push(`<defs><clipPath id="k"><circle cx="100" cy="100" r="97"/></clipPath></defs><g clip-path="url(#k)">`+C(100,100,97,`fill="${base}"`));
      ring(12,a=>{const[x,y]=P(95,a);s.push(C(x,y,18.5,`fill="${col}" opacity=".93"`))});
      speck(50,"#000000",.18,82,97,1.4); s.push("</g>"+C(100,100,80,`fill="${base}"`)); speck(30,spk,dk?.4:.18,76,80,1); break;
    case 2: s.push(C(100,100,97,`fill="${base}"`));
      ring(15,a=>{const[x,y]=P(85,a);s.push(C(x,y,11,`fill="${col}" fill-opacity=".14" stroke="${col}" stroke-width="2.2"`))});
      s.push(C(100,100,79,`fill="${base}"`)+C(100,100,95.5,`fill="none" stroke="${col}" stroke-width="1.6"`)); speck(40,spk,dk?.4:.2,76,96,1); break;
    case 3: s.push(C(100,100,97,`fill="${base}"`)); speck(60,spk,dk?.4:.2,76,96,1);
      ring(8,a=>{const[x,y]=P(86,a);s.push(`<g transform="translate(${x} ${y}) rotate(${(+deg(a)+90).toFixed(1)})"><ellipse cx="-4.6" cy="-1" rx="3.6" ry="6.4" transform="rotate(-28)" fill="${col}" opacity=".75"/><ellipse cx="4.6" cy="-1" rx="3.6" ry="6.4" transform="rotate(28)" fill="${col}" opacity=".75"/><ellipse cx="0" cy="-3" rx="4.3" ry="7.2" fill="${col}"/></g>`);
        const[lx,ly]=P(87,a+Math.PI/8);s.push(`<ellipse cx="${lx}" cy="${ly}" rx="2.6" ry="6" transform="rotate(${deg(a+Math.PI/8)} ${lx} ${ly})" fill="#6f8a55"/>`)}); break;
    case 4: s.push(C(100,100,97,`fill="${base}"`)+C(100,100,94,`fill="none" stroke="${col}" stroke-width="1.6"`)+C(100,100,79.5,`fill="none" stroke="${col}" stroke-width="1"`));
      ring(16,a=>{const[x,y]=P(86.5,a);s.push(`<ellipse cx="${x}" cy="${y}" rx="2.2" ry="5" transform="rotate(${(+deg(a)+35).toFixed(1)} ${x} ${y})" fill="${col}"/>`)});
      ring(16,a=>{const[x,y]=P(87,a);s.push(C(x,y,2.4,`fill="none" stroke="${col}" stroke-width="1.1"`))},Math.PI/16);
      ring(40,a=>{const[x,y]=P(91.3,a);s.push(C(x,y,.9,`fill="${col}"`))}); break;
    case 5: s.push(C(100,100,97,`fill="${base}"`)); speck(170,dk?"#ffffff":col,dk?.6:.45,83,97,1.1);
      s.push(C(100,100,83,'fill="#eef0f5"')); ring(24,a=>{const[x,y]=P(78.6,a);s.push(C(x,y,2.4,`fill="none" stroke="${col}" stroke-width="1.2"`))});
      ring(24,a=>{const[x,y]=P(78.6,a);s.push(C(x,y,.9,`fill="${col}"`))},Math.PI/24); break;
    case 6: s.push(C(100,100,97,`fill="${base}"`));
      ring(56,a=>{const[x1,y1]=P(80.5,a),[x2,y2]=P(92.5,a);s.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="3.4" stroke-linecap="round"/>`)});
      s.push(C(100,100,96,`fill="none" stroke="${col}" stroke-width="2"`)+C(100,100,77.5,`fill="none" stroke="${col}" stroke-width="1"`)); break;
    case 7: ring(10,a=>{const[x,y]=P(73,a);s.push(C(x,y,25,`fill="${col}"`))}); s.push(C(100,100,76,`fill="${col}"`));
      ring(10,a=>{const[x,y]=P(73,a);s.push(C(x,y,22.4,`fill="${base}"`))}); s.push(C(100,100,73.6,`fill="${base}"`));
      ring(10,a=>{const[x,y]=P(85,a);s.push(`<ellipse cx="${x}" cy="${y}" rx="2" ry="4.6" transform="rotate(${deg(a)} ${x} ${y})" fill="#7b9a5a"/>`)}); speck(40,spk,dk?.4:.25,76,94,1); break;
  }

  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">${s.join("")}</svg>`;
  return plateCache[key]=`url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
const plateHTML=(style,src)=>`<div class="plate" style='background-image:${plateBg(style)}'><div class="well">${src?`<img src="${esc(src)}" alt="" loading="lazy">`:""}</div></div>`;
const HEART=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3 1.7-1.8 3.2-3 5.3-3 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>`;
const CHEV=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="${d?"M9 5l7 7-7 7":"M15 5l-7 7 7 7"}"/></svg>`;
const ENV=(sealed)=>`<svg viewBox="0 0 52 38"><rect x="1" y="1" width="50" height="36" rx="4" fill="var(--sheet)" stroke="var(--ink-2)" stroke-width="1.5"/><path d="M2 3l24 18L50 3" fill="none" stroke="var(--ink-2)" stroke-width="1.5"/>${sealed?'<circle cx="26" cy="21" r="6.5" fill="var(--rose)"/>':""}</svg>`;
const MOODS=[["gembira","Gembira","#e0a33a"],["tenang","Tenang","#6f9467"],["rindu","Rindu","#d4607a"],["penat","Penat","#8a7a9e"],["sedih","Sedih","#5a7fb0"],["geram","Geram","#c0503a"]];
const moodOf=k=>MOODS.find(m=>m[0]===k);
const KINDS=[["makan","Tempat makan"],["masak","Resipi nak cuba"],["buat","Nak buat"]];

let hydrating=false,hydrateAgain=false;
async function hydrate(){
  if(!SB)return;if(hydrating){hydrateAgain=true;return}hydrating=true;
  try{
    const sel='img[src^="'+GIF+'#"]',pathOf=i=>i.getAttribute("src").split("#")[1];
    const need=[...new Set([...document.querySelectorAll(sel)].map(pathOf).filter(p=>p&&!SIGNED.has(p)&&!BADSIGN.has(p)))];
    if(need.length){
      const {data,error}=await SB.storage.from(BUCKET).createSignedUrls(need,604800);
      if(!error&&data){data.forEach(r=>{if(r.signedUrl)SIGNED.set(r.path,{u:r.signedUrl,e:Date.now()+6*864e5});else if(r.path)BADSIGN.add(r.path)});saveSigned()}
    }
    document.querySelectorAll(sel).forEach(i=>{const s=SIGNED.get(pathOf(i));if(s)i.src=s.u});
  }catch(e){}
  finally{hydrating=false;if(hydrateAgain){hydrateAgain=false;hydrate()}}
}
new MutationObserver(()=>queueMicrotask(hydrate)).observe(document.body,{childList:true,subtree:true});

const Store={
  async set(col,id,data){
    const row=col==="journal"?{id,user_id:S.uid,data,updated_at:new Date().toISOString()}:{id,space_id:S.space.id,data,updated_at:new Date().toISOString()};
    ok(await SB.from(col).upsert(row));
    const L=S[col],i=L.findIndex(x=>x.id===id);if(i>=0)L[i]={id,...data};else L.push({id,...data});render();
  },
  async update(col,id,patch){const cur=S[col].find(x=>x.id===id);if(!cur)return;const {id:_,...rest}=cur;return this.set(col,id,{...rest,...patch})},
  async del(col,id){ok(await SB.from(col).delete().eq("id",id));S[col]=S[col].filter(x=>x.id!==id);render()},
  async setDoc(path,data){
    if(path==="meta/app")ok(await SB.from("spaces").update({meta:data}).eq("id",S.space.id));
    else if(path==="cycle")ok(await SB.from("cycles").upsert({user_id:S.uid,data,updated_at:new Date().toISOString()}));
    else if(path==="shared/cycle"){ok(await SB.from("shared_cycle").upsert({space_id:S.space.id,user_id:S.uid,data,updated_at:new Date().toISOString()}));return}
    applyDoc(path,data);render();
  },
  async upload(blob,priv){
    const p=(priv?"u/"+S.uid:S.space.id)+"/"+uid()+".jpg";
    ok(await SB.storage.from(BUCKET).upload(p,blob,{contentType:"image/jpeg",cacheControl:"31536000"}));

  rmAsset(p){if(p&&SB)SB.storage.from(BUCKET).remove([p]).catch(()=>{})},
  src(p){if(!p)return null;const s=SIGNED.get(p);return s?s.u:GIF+"#"+p}
};

function subscribe(){

  ["dishes","wishes","letters"].forEach(t=>ch.on("postgres_changes",{event:"*",schema:"public",table:t,filter:"space_id=eq."+sid},again(()=>loadTable(t))));
  ch.on("postgres_changes",{event:"*",schema:"public",table:"shared_cycle",filter:"space_id=eq."+sid},again(loadShared));

}

function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/([,;])/g,"\\$1")}
function apptICS(a){
  const D=a.date.replace(/-/g,""),stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  let when,alarm;
  if(a.time){const[h,m]=a.time.split(":").map(Number),e=h*60+m+60,ed=e>=1440?diso(dnum(a.date)+1).replace(/-/g,""):D,eh=Math.floor(e%1440/60),em=e%60;
    when=`DTSTART:${D}T${String(h).padStart(2,"0")}${String(m).padStart(2,"0")}00\r\nDTEND:${ed}T${String(eh).padStart(2,"0")}${String(em).padStart(2,"0")}00`;alarm="-PT1H"}
  else{when=`DTSTART;VALUE=DATE:${D}\r\nDTEND;VALUE=DATE:${diso(dnum(a.date)+1).replace(/-/g,"")}`;alarm="-PT15H"}
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Diari Kasturi//MS","CALSCALE:GREGORIAN","BEGIN:VEVENT",`UID:${a.id}@diari-kasturi`,`DTSTAMP:${stamp}`,when,`SUMMARY:${icsEsc(a.title||atype(a.type)[1])}`,
    a.place?`LOCATION:${icsEsc(a.place)}`:"",a.note?`DESCRIPTION:${icsEsc(a.note)}`:"","BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(a.title||"Temujanji")}`,`TRIGGER:${alarm}`,"END:VALARM","END:VEVENT","END:VCALENDAR"].filter(Boolean).join("\r\n");
}

}

    const ex=A.existing,id=ex?ex.id:uid();
    await saveAppt(id,{title,type:A.type,date,time:$("#a-time").value||"",place:$("#a-place").value.trim(),note:$("#a-note").value.trim(),createdAt:ex?ex.createdAt:Date.now()},$("#a-priv").checked);

async function markRead(){

function hhmm(t){const d=new Date(t),h=d.getHours(),m=d.getMinutes();return fmtTime(String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"))}
function dayLabel(t){const ds=iso2local(t),dd=dnum(today())-dnum(ds);return dd===0?"Hari ni":dd===1?"Semalam":fmtLong(ds)}
const iso2local=t=>t?iso(new Date(t)):today();
function drawChat(stick){
  const box=$("#chatlist");if(!box)return;
  const near=stick||box.scrollHeight-box.scrollTop-box.clientHeight<120;
  let h="",cur="";const lastMine=[...S.msgs].reverse().find(m=>m.user_id===S.uid);
  if(!S.msgs.length)h=`<p class="chat-empty">Belum ada mesej. Mulakan dengan sapaan pada ${partnerWord()} awak.</p>`;
  S.msgs.forEach(m=>{const dl=dayLabel(m.created_at);if(dl!==cur){cur=dl;h+=`<div class="chat-day">${esc(dl)}</div>`}
    const mine=m.user_id===S.uid;
    h+=`<div class="bub ${mine?"me":"them"}${m.pending?" pending":""}"><span class="bt">${esc(m.body)}</span><span class="bm">${hhmm(m.created_at)}${mine&&lastMine&&m.id===lastMine.id?(m.pending?" · menghantar":m.read?" · dibaca":" · dihantar"):""}</span></div>`});
  box.innerHTML=h;if(near)box.scrollTop=box.scrollHeight;
}
function openChat(){
  if(S.msgsMissing){toast("Jalankan tambah-sembang.sql dalam Supabase dahulu");return}
  S.chatOpen=true;
  openSheet(`<div class="chat-head"><h2>Sembang dengan ${partnerWord()}</h2><button class="round" data-act="close-chat" aria-label="Tutup" style="width:40px;height:40px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

    <div class="quick" id="quick">${QUICK.map(q=>`<button type="button" class="chip" data-quick="${esc(q)}">${esc(q)}</button>`).join("")}</div>
    <div class="composer"><textarea class="inp" id="c-msg" rows="1" maxlength="2000" placeholder="Tulis mesej…" enterkeyhint="send"></textarea><button class="send" data-act="send-msg" aria-label="Hantar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.4-7.5c.8-.4.8-1.5 0-1.8L3.4 3.6c-.7-.3-1.4.3-1.3 1l1.2 6.1 9.2 1.3-9.2 1.3-1.2 6.1c-.1.7.6 1.3 1.3 1z"/></svg></button></div>`,"chat");
  drawChat(true);markRead();
  const ta=$("#c-msg");
  ta.addEventListener("input",()=>{ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,120)+"px"});
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMsg()}});
}
async function sendMsg(text){
  const ta=$("#c-msg"),body=(text??(ta?ta.value:"")).trim();if(!body)return;
  if(ta&&text==null){ta.value="";ta.style.height="auto";ta.focus()}
  const m={id:uid(),user_id:S.uid,body,read:false,created_at:new Date().toISOString(),pending:true};
  S.msgs.push(m);drawChat(true);
  try{ok(await SB.from("messages").insert({id:m.id,space_id:S.space.id,user_id:S.uid,body}));m.pending=false;drawChat()}
  catch(e){S.msgs=S.msgs.filter(x=>x.id!==m.id);drawChat();if(ta&&!ta.value)ta.value=body;toast("Mesej tak dihantar. Semak internet.")}
}
function chatCard(){

function identToEmail(v){
  v=(v||"").trim();if(!v)return null;

  let d=v.replace(/\D/g,"");
  if(d.startsWith("0"))d="6"+d;else if(!d.startsWith("60")&&d.length>=9&&d.length<=10)d="60"+d;
  if(d.length<10||d.length>13)return null;
  return d+PHONE_DOMAIN;
}

/* ---------- cycle maths ---------- */
function cycleInfo(c){
  const P=((c&&c.periods)||[]).filter(p=>p&&p.start).slice().sort((a,b)=>a.start.localeCompare(b.start));
  if(!P.length)return null;
  const t=dnum(today()),st=P.map(p=>dnum(p.start)),avg=a=>Math.round(a.reduce((x,y)=>x+y,0)/a.length);
  const diffs=[];for(let i=1;i<st.length;i++){const d=st[i]-st[i-1];if(d>=18&&d<=50)diffs.push(d)}
  const avgC=diffs.length?avg(diffs.slice(-6)):(+c.cycleLen||28);
  const lens=P.filter(p=>p.end).map(p=>dnum(p.end)-dnum(p.start)+1).filter(n=>n>=1&&n<=12).slice(-6);
  const avgL=lens.length?avg(lens):(+c.periodLen||5);
  const last=P[P.length-1],ls=dnum(last.start);
  const inPeriod=last.end?(t>=ls&&t<=dnum(last.end)):(t>=ls&&t-ls<12);
  const logged=new Set();
  P.forEach((p,i)=>{const s=dnum(p.start),e=p.end?dnum(p.end):(i===P.length-1?Math.min(Math.max(t,s),s+11):s+avgL-1);for(let d=s;d<=e&&d<=s+14;d++)logged.add(d)});
  const next=ls+avgC,late=(!inPeriod&&t>next)?t-next:0;
  const pred=new Set(),fert=new Set(),ov=new Set();
  for(let k=0;k<4;k++){const s=next+k*avgC;for(let d=s;d<s+avgL;d++)if(!logged.has(d)&&d>=t)pred.add(d);const o=s-14;ov.add(o);for(let d=o-5;d<=o+1;d++)if(!logged.has(d))fert.add(d)}
  let fw=null;for(let k=0;k<2;k++){const o=next+k*avgC-14;if(o+1>=t){fw=[o-5,o+1];break}}
  return{avgC,avgL,next,late,day:t-ls+1,inPeriod,logged,pred,fert,ov,P,last,t,fw};
}
async function saveCycle(c){
  if(S.mode==="cloud"&&!S.uid){toast("Tak dapat kenal pasti akaun — kitaran tak disimpan.");return}
  S.cycle=c;render();
  await Store.setDoc(cyclePath(),c);
  const info=cycleInfo(c);
  if(c.share&&info)await Store.setDoc("shared/cycle",{next:diso(info.next),avgL:info.avgL,inPeriod:info.inPeriod,by:me(),updatedAt:Date.now()});
  else if(S.shared&&!S.shared.off)await Store.setDoc("shared/cycle",{off:true,by:me(),updatedAt:Date.now()});
}
const myCycle=()=>S.cycle||{periods:[],share:false,cycleLen:28,periodLen:5};
async function periodStart(date){
  const c=myCycle(),P=[...(c.periods||[])];
  const last=P.slice().sort((a,b)=>a.start.localeCompare(b.start)).pop();
  if(last&&!last.end&&dnum(date)-dnum(last.start)<12&&dnum(date)>=dnum(last.start)){toast("Period ni dah dicatat");return}
  P.push({start:date,end:null});await saveCycle({...c,periods:P});toast("Period dicatat. Jaga diri ya.");
}
async function periodEnd(date){
  const c=myCycle(),P=(c.periods||[]).map(p=>({...p})).sort((a,b)=>a.start.localeCompare(b.start));
  const cand=P.filter(p=>dnum(p.start)<=dnum(date)).pop();
  if(!cand){toast("Tiada period sebelum tarikh ni");return}
  cand.end=date;await saveCycle({...c,periods:P});toast("Tamat period dicatat");
}

function ordered(list){return[...list].sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.createdAt||0)-(b.createdAt||0))}
function unreadLetters(){const t=today();return S.letters.filter(l=>l.from!==me()&&!l.read&&(!l.openOn||l.openOn<=t)).length}
function render(){
  $("#title").textContent=S.meta.title||DEFAULT_META.title;
  const av=Store.src(S.meta.avatar),t=(S.meta.title||"d").trim();
  $("#avatarBtn").innerHTML=av?`<img src="${esc(av)}" alt="">`:`<span class="ini">${esc((t[0]||"d").toUpperCase())}</span>`;
  let sub=fmtLong(today()).replace(/ \d{4}$/,"");
  const ci=canCycle()?cycleInfo(S.cycle):null;
  if(ci)sub+=ci.inPeriod?` · period hari ke-<b>${ci.day}</b>`:` · hari ke-<b>${ci.day}</b> kitaran`;
  const ta=S.appts.filter(a=>a.date===today()).length;if(ta)sub+=` · <b>${ta} temujanji</b> hari ni`;
  if(S.mode==="loading")sub="Membuka diari…";else if(S.mode==="memory")sub="Storan tak tersedia — data hilang bila tutup.";
  $("#subh").innerHTML=sub;
  $("#addBtn").hidden=!S.canEdit;
  $$("[data-tab]").forEach(b=>{if(b.dataset.tab===S.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  const n=unreadLetters()+unreadMsgs()+newReqs(),kb=$("#kitaBadge");kb.hidden=!n;kb.textContent=n;
  $("#chips").hidden=S.tab!=="makan";
  if(S.tab==="makan")renderChips();
  ({makan:renderMakan,jurnal:renderJurnal,kalendar:renderKalendar,kita:renderKita})[S.tab]();
}
function renderChips(){
  const C=cats();if(S.filter!=="all"&&!C.includes(S.filter))S.filter="all";
  const count=c=>S.dishes.filter(d=>d.cat===c).length;
  $("#chips").innerHTML=`<button class="chip" data-f="all" aria-pressed="${S.filter==="all"}">Semua${S.filter==="all"?` (${S.dishes.length})`:""}</button>`+
    C.map(c=>`<button class="chip" data-f="${esc(c)}" aria-pressed="${S.filter===c}">${esc(c)}${S.filter===c?` (${count(c)})`:""}</button>`).join("")+
    (S.canEdit?`<button class="chip add" data-act="newcat" aria-label="Tambah kategori">+</button>`:"");
}
function renderMakan(){
  const m=$("#main"),L=ordered(S.dishes.filter(d=>S.filter==="all"||d.cat===S.filter)).map((d,i)=>({d,n:i+1})).reverse();

function pageHTML(j,full){
  const md=moodOf(j.mood),src=Store.src(j.photo);
  return `<article class="page${full?" full":""}" ${full?"":`data-j="${esc(j.id)}" role="button" tabindex="0"`}>
    ${src?`<span class="pol"><img src="${esc(src)}" alt="" loading="lazy"></span>`:""}
    <div class="pd">${esc(fmtDate(j.date))}${md?`<span class="mood"><i style="background:${md[2]}"></i>${md[1]}</span>`:""}</div>
    <h3>${esc(j.title||"Catatan")}</h3><p>${esc(j.text||"")}</p></article>`;

function renderJurnal(){
  const m=$("#main"),L=[...S.journal].sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
  if(!L.length){m.innerHTML=`<div class="jlist"><article class="page"><div class="pd">${esc(fmtDate(today()))}</div><h3>Halaman pertama</h3><p>Tulis apa saja: hari ni macam mana, apa yang buat tersenyum, apa yang nak diingat. Boleh letak gambar dan mood sekali. Jurnal ni peribadi, hanya akaun awak yang boleh baca.</p></article>${S.canEdit?`<button class="btn" data-act="add-journal">Tulis jurnal</button>`:""}</div>`;return}
  m.innerHTML=`<p class="small" style="margin-top:18px">Peribadi · hanya akaun awak yang boleh baca jurnal ni.</p><div class="jlist" style="margin-top:12px">${L.map(j=>pageHTML(j)).join("")}</div>`;
}
function ringSVG(ci){
  const p=Math.max(0,Math.min(1,ci.day/ci.avgC)),R=38,C=2*Math.PI*R;
  return `<svg class="ring" viewBox="0 0 92 92"><circle cx="46" cy="46" r="${R}" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="46" cy="46" r="${R}" fill="none" stroke="var(--rose)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 46 46)"/><text x="46" y="44" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="24" fill="var(--ink)">${ci.day}</text><text x="46" y="61" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink-2)">hari</text></svg>`;
}
function partnerCard(){
  const sh=S.shared;if(!(sh&&!sh.off&&sh.next&&sh.by&&sh.by!==me()))return"";
  const d=dnum(sh.next)-dnum(today()),v=d>0?`Period dalam ${d} hari`:d>-(sh.avgL||5)?"Mungkin sedang period":"Menunggu kemas kini";
  return `<div class="cyc"><div class="info"><div class="k">Kitaran sayang</div><div class="v">${v}</div><div class="s">${d>0?"Jangkaan "+fmtShort(sh.next)+". ":""}Dikongsi oleh dia · anggaran sahaja.</div></div></div>`;
}
function cycleCard(){return partnerCard()+ownCycleCard()}
function ownCycleCard(){
  const ci=cycleInfo(S.cycle);
  if(ci){
    let k,v,s,btn;
    if(ci.inPeriod){k="Sedang period";v=`Hari ke-${ci.day}`;s=`Anggaran tamat ${fmtShort(diso(dnum(ci.last.start)+ci.avgL-1))}. Rehat cukup, minum air banyak.`;btn=`<button class="mini" data-act="cycle-end">Period dah habis</button>`}
    else if(ci.late){k="Kitaran hari ke-"+ci.day;v=`Lewat ${ci.late} hari`;s=`Jangkaan asal ${fmtShort(diso(ci.next))}.`;btn=`<button class="mini" data-act="cycle-start">Period mula hari ni</button>`}
    else{const d=ci.next-ci.t;k="Kitaran hari ke-"+ci.day;v=d===0?"Period dijangka hari ni":`Period dalam ${d} hari`;s=`Jangkaan ${fmtShort(diso(ci.next))}`+(ci.fw?` · tempoh subur ${fmtShort(diso(ci.fw[0]))}–${fmtShort(diso(ci.fw[1]))}`:"");btn=`<button class="mini" data-act="cycle-start">Period mula hari ni</button>`}
    return `<div class="cyc">${ringSVG(ci)}<div class="info"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div><div class="btns" style="gap:8px;flex-wrap:wrap">${S.canEdit?btn:""}<button class="mini soft" data-act="cycle-manage">Urus kitaran</button></div></div></div>`;
  }
  return `<div class="cyc"><div class="info"><div class="k">Kitaran</div><div class="v">Mula jejak kitaran</div><div class="s">Tekan bila period mula. Data ini peribadi, hanya awak yang nampak.</div>${S.canEdit?`<div class="btns" style="gap:8px;flex-wrap:wrap"><button class="mini" data-act="cycle-start">Period mula hari ni</button><button class="mini soft" data-act="cycle-manage">Catat tarikh lepas</button></div>`:""}</div></div>`;
}
function dayPhotos(){const M={};[...S.dishes,...S.journal].forEach(x=>{if(x.date&&x.photo&&!M[x.date])M[x.date]=x.photo});return M}
function renderKalendar(){
  const [y,mo]=S.calMonth.split("-").map(Number),first=(new Date(y,mo-1,1).getDay()+6)%7,days=new Date(y,mo,0).getDate();
  const ci=canCycle()?cycleInfo(S.cycle):null,ph=dayPhotos(),tt=today(),AP={};
  S.appts.forEach(a=>{if(!AP[a.date])AP[a.date]=atype(a.type)[2]});
  let cells=["Isn","Sel","Rab","Kha","Jum","Sab","Ahd"].map(d=>`<div class="dow">${d}</div>`).join("");
  for(let i=0;i<first;i++)cells+=`<span class="day out"></span>`;
  for(let d=1;d<=days;d++){
    const ds=S.calMonth+"-"+String(d).padStart(2,"0"),n=dnum(ds),src=ph[ds]?Store.src(ph[ds]):null,cl=["day"];
    if(src)cl.push("has");if(ds===tt)cl.push("today");
    if(ci){if(ci.logged.has(n))cl.push("per");else if(ci.pred.has(n))cl.push("pred");if(ci.fert.has(n)&&!ci.logged.has(n))cl.push("fert");if(ci.ov.has(n)&&!ci.logged.has(n))cl.push("ov")}
    cells+=`<button class="${cl.join(" ")}" data-day="${ds}" aria-label="${esc(fmtLong(ds))}">${src?`<img src="${esc(src)}" alt="" loading="lazy">`:""}<span>${d}</span>${AP[ds]?`<i class="ap" style="background:${AP[ds]}"></i>`:""}</button>`;
  }
  $("#main").innerHTML=cycleCard()+apptSection()+`<div class="calnav"><button data-act="cal-prev" aria-label="Bulan sebelum">${CHEV(0)}</button><h3>${monthName(S.calMonth)}</h3><button data-act="cal-next" aria-label="Bulan seterusnya">${CHEV(1)}</button></div>
    <div class="cal">${cells}</div>
    <div class="legend">${ci?`<span><i style="background:var(--rose-soft);border:2px solid var(--rose)"></i>Period</span><span><i style="border:2px dashed var(--rose)"></i>Jangkaan</span><span><i style="background:var(--sage);width:8px;height:8px"></i>Subur</span>`:""}<span><i style="outline:2px solid var(--ink);outline-offset:-2px"></i>Hari ni</span><span><i style="background:#5a7fb0;width:8px;height:8px"></i>Temujanji</span><span>Gambar = ada kenangan</span></div>`;
}
function renderKita(){
  const t=today(),mine=me();
  const L=[...S.letters].sort((a,b)=>{const ra=a.from!==mine,rb=b.from!==mine;if(ra!==rb)return ra?-1:1;return(b.createdAt||0)-(a.createdAt||0)});
  const letters=L.map(l=>{const recv=l.from!==mine,locked=recv&&l.openOn&&l.openOn>t,unread=recv&&!l.read&&!locked;
    const who=l.fromOwner?"suami":"isteri";
    return `<button class="letter" data-letter="${esc(l.id)}"><span class="env">${ENV(locked||unread)}</span><span class="txt"><span class="t1">${recv?esc(l.title||"Surat dari "+who):"Kepada sayang"+(l.title?": "+esc(l.title):"")}</span><span class="t2">${locked?"Berkunci sampai "+esc(fmtDate(l.openOn)):recv?"Dari "+who+" · "+esc(fmtDate(iso(new Date(l.createdAt||Date.now())))):"Dihantar · "+esc(fmtDate(iso(new Date(l.createdAt||Date.now()))))+(l.read?" · dah dibaca":"")}</span></span>${unread?'<span class="dot" aria-label="Belum dibaca"></span>':""}</button>`}).join("");

  $("#main").innerHTML=chatCard()+reqSection()+`
    <h2 class="h2">Peti surat ${S.canEdit?`<button class="linkbtn" data-act="add-letter">Tulis surat</button>`:""}</h2>
    ${letters||`<p class="small">Belum ada surat. Tulis nota untuk sayang, boleh juga kunci sampai hari istimewa.</p>`}
    <h2 class="h2">Senarai hajat <small>${S.wishes.filter(w=>w.done).length}/${S.wishes.length} tercapai</small></h2>
    ${S.canEdit?`<div class="wrapchips" id="w-kinds">${KINDS.map(k=>`<button class="chip" data-kind="${k[0]}" aria-pressed="${S.wishKind===k[0]}">${k[1]}</button>`).join("")}</div>
    <div class="addrow"><input class="inp" id="w-text" placeholder="cth. Makan sushi kat Melaka" maxlength="80" enterkeyhint="done"><button class="mini" data-act="wish-save">Tambah</button></div>`:""}
    <div>${wishes||`<p class="small">Senarai masih kosong.</p>`}</div>
    <h2 class="h2">Rekap bulan</h2>${recapHTML()}`;
  const wi=$("#w-text");if(wi)wi.addEventListener("keydown",e=>{if(e.key==="Enter")saveWish()});
}
function recapHTML(){
  const m=S.recapMonth,inM=x=>(x.date||"").startsWith(m);
  const D=S.dishes.filter(inM),J=S.journal.filter(inM),Wd=S.wishes.filter(w=>w.done&&(w.doneAt||"").startsWith(m));
  const pics=[...D].sort((a,b)=>(b.rating||0)-(a.rating||0)).concat(J).filter(x=>x.photo).map(x=>Store.src(x.photo)).filter(Boolean);
  const places=new Set(D.map(d=>(d.place||"").trim().toLowerCase()).filter(Boolean));
  let col="";
  if(pics.length>=6)col=`<div class="collage"><img class="hero" src="${esc(pics[0])}" alt="">${pics.slice(1,6).map(p=>`<img src="${esc(p)}" alt="" loading="lazy">`).join("")}</div>`;
  else if(pics.length)col=`<div class="collage">${pics.slice(0,3).map(p=>`<img src="${esc(p)}" alt="" loading="lazy">`).join("")}</div>`;
  const best=D.filter(d=>d.rating).sort((a,b)=>b.rating-a.rating)[0];
  const mc={};J.forEach(j=>{if(j.mood)mc[j.mood]=(mc[j.mood]||0)+1});const topM=Object.entries(mc).sort((a,b)=>b[1]-a[1])[0];
  const cc={};D.forEach(d=>{if(d.cat)cc[d.cat]=(cc[d.cat]||0)+1});const topC=Object.entries(cc).sort((a,b)=>b[1]-a[1])[0];
  const hl=[best?`Paling sedap: <b>${esc(best.name||"tanpa nama")}</b>${best.place?" di "+esc(best.place):""} (${best.rating}/5)`:"",topM?`Mood paling kerap: <b>${moodOf(topM[0])[1].toLowerCase()}</b>`:"",topC?`Paling banyak makan: <b>${esc(topC[0])}</b>`:""].filter(Boolean);
  const empty=!D.length&&!J.length&&!Wd.length;
  return `<div class="recap"><div class="nav"><button data-act="rec-prev" aria-label="Bulan sebelum">${CHEV(0)}</button><b>${monthName(m)}</b><button data-act="rec-next" aria-label="Bulan seterusnya">${CHEV(1)}</button></div>
    ${empty?`<p class="small" style="text-align:center;margin:18px 0 6px">Belum ada kenangan bulan ni.</p>`:`${col}
    <div class="nums"><div><b>${D.length}</b><span>hidangan</span></div><div><b>${J.length}</b><span>jurnal</span></div><div><b>${places.size}</b><span>tempat</span></div><div><b>${Wd.length}</b><span>hajat</span></div></div>
    ${hl.map(h=>`<p class="hl">${h}</p>`).join("")}`}</div>`;
}

function drawPicker(){
  const k=pkey(F.plate),mine=(S.meta.myPlates||[]).filter(p=>!isPreset(p));
  const btn=(st,label)=>`<button type="button" data-plate='${esc(JSON.stringify(normPlate(st)))}' aria-label="${esc(label)}" aria-pressed="${pkey(st)===k}">${plateHTML(st)}</button>`;
  let h=mine.map((p,j)=>btn(p,"Pinggan saya "+(j+1))).join("");
  if(!isPreset(F.plate)&&!mine.some(p=>pkey(p)===k))h=btn(F.plate,"Pinggan baru")+h;
  $("#f-plates").innerHTML=(h?h+'<span class="pp-sep"></span>':"")+PLATES.map((p,i)=>btn(i,p)).join("");
  $$("#f-pat [data-pat]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.pat===F.plate.p));
  $$("#f-col [data-col]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.col===F.plate.c));
  $$("#f-base [data-base]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.base===F.plate.b));
  const ci=$("#f-colany"),bi=$("#f-baseany");if(ci)ci.value=F.plate.c;if(bi)bi.value=F.plate.b;
}
function setPlate(st){F.plate=normPlate(st);drawPicker();drawFormPlate()}
async function rememberPlate(st){if(isPreset(st))return;const k=pkey(st),L=(S.meta.myPlates||[]).filter(p=>pkey(p)!==k);await saveMeta({myPlates:[normPlate(st),...L].slice(0,16)})}
function drawFormPlate(){$("#f-plate").innerHTML=plateHTML(F.plate,F.preview).replace('<div class="well"></div>','<div class="well"></div><span class="hint">Tekan untuk pilih gambar</span>')}
async function submitDish(){
  const btn=$("#f-save"),err=$("#f-err"),nc=$("#f-newcat");let cat=F.cat;if(!nc.hidden&&nc.value.trim())cat=nc.value.trim().toLowerCase();
  if(!F.existing&&!F.blob){err.textContent="Pilih gambar dulu — tekan pinggan di atas.";return}
  const ing=$("#f-ing").value.trim(),steps=$("#f-steps").value.trim();
  const data={name:$("#f-name").value.trim(),place:$("#f-place").value.trim(),date:$("#f-date").value||today(),cat,note:$("#f-note").value.trim(),rating:F.rating,plate:F.plate,recipe:(ing||steps)?{ing,steps}:null};
  btn.disabled=true;btn.textContent="Menyimpan…";err.textContent="";
  try{
    if(cat&&!(S.meta.cats||[]).includes(cat))await saveMeta({cats:[...(S.meta.cats||[]),cat]});
    await rememberPlate(F.plate).catch(()=>{});
    let photo=F.existing?F.existing.photo:null;
    if(F.blob){photo=await Store.upload(F.blob)}
    const id=F.existing?F.existing.id:uid();
    await Store.set("dishes",id,{...data,photo,createdAt:F.existing?F.existing.createdAt:Date.now()});
    if(F.blob&&F.existing&&F.existing.photo)Store.rmAsset(F.existing.photo);
    if(F.after)await F.after().catch(()=>{});
    const was=!!F.existing;closeSheet();toast(was?"Dikemas kini":"Tersimpan");
    if(!was&&S.filter!=="all"&&S.filter!==cat)S.filter=cat;render();
  }catch(e){btn.disabled=false;btn.textContent="Cuba simpan lagi";err.textContent=saveErr(e)}
}

function showDay(ds){
  const n=dnum(ds),ci=canCycle()?cycleInfo(S.cycle):null;
  const D=S.dishes.filter(d=>d.date===ds),Jn=S.journal.filter(j=>j.date===ds);
  const row=(x,kind)=>`<button class="letter" ${kind==="d"?`data-open="${esc(x.id)}"`:`data-j="${esc(x.id)}"`}>${kind==="d"?`<span style="width:52px;flex:none">${plateHTML(x.plate,Store.src(x.photo))}</span>`:`<span class="env" style="display:grid;place-items:center">${x.photo?`<img src="${esc(Store.src(x.photo))}" alt="" style="width:46px;height:46px;object-fit:cover;border-radius:8px">`:ENV(false)}</span>`}<span class="txt"><span class="t1">${esc(kind==="d"?(x.name||"Hidangan"):(x.title||"Catatan"))}</span><span class="t2">${kind==="d"?esc(x.place||x.cat||""):"Jurnal"}</span></span></button>`;
  let per="";
  if(ci&&ci.logged.has(n))per=`<p class="meta" style="color:var(--rose);font-weight:700">Hari period</p>`;
  else if(ci&&ci.pred.has(n))per=`<p class="meta" style="color:var(--rose)">Jangkaan period</p>`;
  else if(ci&&ci.ov.has(n))per=`<p class="meta" style="color:var(--sage)">Anggaran hari ovulasi</p>`;
  else if(ci&&ci.fert.has(n))per=`<p class="meta" style="color:var(--sage)">Tempoh subur (anggaran)</p>`;
  const cyc=S.canEdit&&(canCycle()||!S.isOwner)&&n<=dnum(today())?`<div class="btns" style="flex-wrap:wrap"><button class="btn rose" data-act="day-start" data-d="${ds}">Period mula hari ni</button>${ci&&ci.logged.size?`<button class="btn soft" data-act="day-end" data-d="${ds}">Period tamat hari ni</button>`:""}</div>`:"";
  openSheet(`<h2>${esc(fmtLong(ds))}</h2>${per}
    <div style="margin-top:14px">${S.appts.filter(a=>a.date===ds).sort(apptSort).map(apptRow).join("")}${D.map(x=>row(x,"d")).join("")}${Jn.map(x=>row(x,"j")).join("")}${!D.length&&!Jn.length&&!S.appts.some(a=>a.date===ds)?`<p class="small">Tiada catatan pada hari ni lagi.</p>`:""}</div>
    ${S.canEdit?`<div class="btns"><button class="btn soft" data-act="day-journal" data-d="${ds}">+ Jurnal</button><button class="btn soft" data-act="day-dish" data-d="${ds}">+ Hidangan</button></div><button class="btn soft" data-act="day-appt" data-d="${ds}" style="margin-top:10px">+ Temujanji</button>`:""}${cyc}`);
}

    <p class="small" style="margin-top:4px">Catatan ini peribadi. Hanya akaun awak yang boleh baca, pasangan pun tak nampak.</p>

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target;
  if(t.id==="scrim"){closeSheet();return}
  const tb=t.closest("[data-tab]");if(tb){S.tab=tb.dataset.tab;render();scrollTo(0,0);return}
  const f=t.closest("[data-f]");if(f){S.filter=f.dataset.f;render();return}
  const o=t.closest("[data-open]");if(o){showDetail(o.dataset.open);return}
  const jj=t.closest("[data-j]");if(jj){showJournal(jj.dataset.j);return}
  const qk=t.closest("[data-quick]");if(qk){sendMsg(qk.dataset.quick);return}
  const rq=t.closest("[data-req]");if(rq){showReq(rq.dataset.req);return}
  const rt=t.closest("[data-rtype]");if(rt&&R){R.type=rt.dataset.rtype;$$("#r-types [data-rtype]").forEach(b=>b.setAttribute("aria-pressed",b===rt));return}
  const ap=t.closest("[data-appt]");if(ap){closeSheet();showAppt(ap.dataset.appt);return}
  const at=t.closest("[data-atype]");if(at&&A){A.type=at.dataset.atype;$$("#a-types [data-atype]").forEach(b=>b.setAttribute("aria-pressed",b===at));return}
  const dy=t.closest("[data-day]");if(dy){showDay(dy.dataset.day);return}
  const lt=t.closest("[data-letter]");if(lt){showLetter(lt.dataset.letter);return}
  const pl=t.closest("[data-plate]");if(pl&&F){try{setPlate(JSON.parse(pl.dataset.plate))}catch(err){}return}
  const pt=t.closest("[data-pat]");if(pt&&F){setPlate({...F.plate,p:+pt.dataset.pat});return}
  const sc=t.closest("[data-col]");if(sc&&F){setPlate({...F.plate,c:sc.dataset.col});return}
  const sb=t.closest("[data-base]");if(sb&&F){setPlate({...F.plate,b:sb.dataset.base});return}
  const ct=t.closest("[data-cat]:not([data-act])");if(ct&&F){F.cat=ct.dataset.cat;$("#f-newcat").hidden=true;$$("#f-cats [data-cat]").forEach(b=>b.setAttribute("aria-pressed",b===ct));return}
  const hb=t.closest("[data-heart]");if(hb&&F){const v=+hb.dataset.heart;F.rating=F.rating===v?0:v;$$("#f-hearts button").forEach(b=>b.classList.toggle("on",+b.dataset.heart<=F.rating));return}
  const md=t.closest("[data-mood]");if(md&&J){J.mood=J.mood===md.dataset.mood?"":md.dataset.mood;$$("#j-moods [data-mood]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mood===J.mood));return}
  const kd=t.closest("[data-kind]");if(kd){S.wishKind=kd.dataset.kind;$$("#w-kinds [data-kind]").forEach(b=>b.setAttribute("aria-pressed",b===kd));return}
  const a=t.closest("[data-act]");if(!a)return;
  const act=a.dataset.act,id=a.dataset.id;
  try{switch(act){
    case "newcat":showNewCat();break;
    case "logout":await disablePush().catch(()=>{});await SB.auth.signOut();try{localStorage.removeItem("dk-signed")}catch(e){}location.reload();break;
    case "copycode":{const c=S.code||"";try{await navigator.clipboard.writeText(c);toast("Kod disalin")}catch(e){const el=$("#m-code");if(el){const r=document.createRange();r.selectNodeContents(el);const sl=getSelection();sl.removeAllRanges();sl.addRange(r)}toast("Tekan lama untuk salin")}break}
    case "savecat":{const v=$("#c-name").value.trim().toLowerCase();if(!v){$("#cat-err").textContent="Tulis nama kategori dulu.";return}if(cats().includes(v)){$("#cat-err").textContent="Kategori ni dah ada.";return}await saveMeta({cats:[...(S.meta.cats||[]),v]});S.filter=v;closeSheet();render();break}
    case "fnewcat":{const i=$("#f-newcat");i.hidden=false;i.focus();F.cat="";$$("#f-cats [data-cat]").forEach(b=>b.setAttribute("aria-pressed","false"));break}
    case "customize":{const c=$("#f-custom");c.hidden=!c.hidden;a.setAttribute("aria-expanded",!c.hidden);a.textContent=c.hidden?"Reka pinggan sendiri":"Tutup reka pinggan";if(!c.hidden)c.scrollIntoView({block:"nearest",behavior:"smooth"});break}
    case "recipe":{const r=$("#f-recipe");r.hidden=!r.hidden;a.textContent=r.hidden?"Tambah resipi":"Sembunyi resipi";break}
    case "edit":{const d=S.dishes.find(x=>x.id===id);closeSheet();if(d)showForm(d);break}
    case "j-edit":{const j=S.journal.find(x=>x.id===id);closeSheet();if(j)showJForm(j);break}
    case "askdel":$("#delbox").innerHTML=`<p class="small" style="color:var(--danger);font-weight:600">${esc(a.dataset.msg)}</p><div class="btns"><button class="btn soft" data-act="nodel">Tak jadi</button><button class="btn" style="background:var(--danger);color:var(--sheet)" data-act="dodel" data-c="${esc(a.dataset.c)}" data-id="${esc(id)}">Ya, padam</button></div>`;break;
    case "nodel":$("#delbox").innerHTML="";break;
    case "dodel":{const col=a.dataset.c,x=S[col].find(y=>y.id===id);a.disabled=true;await Store.del(col,id);if(x&&x.photo)Store.rmAsset(x.photo);closeSheet();toast("Dipadam");break}
    case "savetitle":{const v=$("#m-title").value.trim();if(!v)return;await saveMeta({title:v});closeSheet();toast("Nama ditukar");break}
    case "delcat":{const c=a.dataset.cat;await saveMeta({cats:(S.meta.cats||[]).filter(x=>x!==c)});showMore();break}
    case "delplate":{const k=a.dataset.k;await saveMeta({myPlates:(S.meta.myPlates||[]).filter(p=>pkey(p)!==k)});showMore();break}
    case "add-dish":closeSheet();showForm(null);break;
    case "add-journal":closeSheet();showJForm(null);break;
    case "add-wish":closeSheet();showWishForm();break;
    case "add-letter":closeSheet();showLetterForm();break;
    case "wish-save":await saveWish();break;
    case "wish-sheet-save":{const v=$("#ws-text").value.trim();if(!v)return;await saveWish(v,S.wishKind);closeSheet();S.tab="kita";render();break}
    case "wish-tick":{const w=S.wishes.find(x=>x.id===id);if(w)await Store.update("wishes",id,{done:!w.done,doneAt:w.done?"":today()});if(w&&!w.done)toast("Alhamdulillah, tercapai!");break}
    case "wish-del":await Store.del("wishes",id);break;
    case "wish-log":{const w=S.wishes.find(x=>x.id===id);if(!w)return;showForm(null,{name:w.text,cat:w.kind==="masak"?"masakan rumah":undefined,date:w.doneAt||today(),after:()=>Store.update("wishes",id,{logged:true})});break}
    case "letter-send":await sendLetter(a);break;
    case "cal-prev":S.calMonth=shiftMonth(S.calMonth,-1);render();break;
    case "cal-next":S.calMonth=shiftMonth(S.calMonth,1);render();break;
    case "rec-prev":S.recapMonth=shiftMonth(S.recapMonth,-1);render();break;
    case "rec-next":S.recapMonth=shiftMonth(S.recapMonth,1);render();break;
    case "cycle-start":closeSheet();await periodStart(today());break;
    case "cycle-end":await periodEnd(today());break;
    case "cycle-manage":showCycle();break;
    case "day-start":closeSheet();await periodStart(a.dataset.d);break;
    case "day-end":closeSheet();await periodEnd(a.dataset.d);break;
    case "day-journal":closeSheet();showJForm(null,{date:a.dataset.d});break;
    case "day-dish":closeSheet();showForm(null,{date:a.dataset.d});break;
    case "day-appt":closeSheet();showApptForm(null,{date:a.dataset.d});break;
    case "add-appt":closeSheet();showApptForm(null);break;
    case "open-chat":openChat();break;
    case "push-on":{a.disabled=true;a.textContent="Sekejap…";try{await enablePush();toast("Notifikasi dihidupkan");try{await testPush()}catch(e){}}catch(e){toast(e.message==="denied"?"Notifikasi disekat dalam Settings telefon":e.message==="dismissed"?"Tekan Allow untuk hidupkan":"Tak dapat hidupkan. Cuba lagi.")}drawPush();break}
    case "push-off":a.disabled=true;await disablePush();toast("Notifikasi dimatikan");drawPush();break;
    case "push-test":{a.disabled=true;try{const n=await testPush();toast(n?"Ujian dihantar, tunggu sekejap":"Tiada telefon berdaftar. Hidupkan semula.")}catch(e){toast("Ujian gagal. Pastikan fungsi notify dah di-deploy.")}a.disabled=false;break}
    case "close-chat":closeSheet();break;
    case "send-msg":await sendMsg();break;
    case "add-req":closeSheet();showReqForm();break;
    case "req-set":a.disabled=true;await setReq(id,a.dataset.s);break;
    case "req-del":a.disabled=true;ok(await SB.from("requests").delete().eq("id",id));S.reqs=S.reqs.filter(x=>x.id!==id);closeSheet();toast("Dibuang");render();break;
    case "appt-ics":{const x=S.appts.find(y=>y.id===id);if(x)exportAppt(x);break}
    case "appt-edit":{const x=S.appts.find(y=>y.id===id);closeSheet();if(x)showApptForm(x);break}
    case "appt-askdel":$("#delbox").innerHTML=`<p class="small" style="color:var(--danger);font-weight:600">Padam temujanji ni?</p><div class="btns"><button class="btn soft" data-act="nodel">Tak jadi</button><button class="btn" style="background:var(--danger);color:var(--sheet)" data-act="appt-dodel" data-id="${esc(id)}">Ya, padam</button></div>`;break;
    case "appt-dodel":a.disabled=true;await delAppt(id);closeSheet();toast("Dipadam");break;
    case "cyc-add":{const s=$("#c-start").value,en=$("#c-end").value;if(!s){$("#c-err").textContent="Pilih tarikh mula.";return}if(en&&en<s){$("#c-err").textContent="Tarikh tamat mesti selepas tarikh mula.";return}
      const c=myCycle();if((c.periods||[]).some(p=>p.start===s)){$("#c-err").textContent="Tarikh ni dah ada dalam rekod.";return}
      await saveCycle({...c,periods:[...(c.periods||[]),{start:s,end:en||null}]});toast("Dicatat");showCycle();break}
    case "cyc-del":{const c=myCycle();await saveCycle({...c,periods:(c.periods||[]).filter(p=>p.start!==a.dataset.s)});showCycle();break}
    case "cyc-settings":{const L=Math.min(50,Math.max(18,+$("#c-len").value||28)),PL=Math.min(12,Math.max(1,+$("#c-plen").value||5));await saveCycle({...myCycle(),cycleLen:L,periodLen:PL});toast("Tetapan disimpan");closeSheet();break}
  }}catch(err){toast("Tak dapat simpan. Semak internet dan cuba lagi.");a.disabled=false}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeSheet();
  if(e.key==="Enter"&&e.target.matches&&e.target.matches('[role="button"]'))e.target.click();
});
$("#addBtn").addEventListener("click",showAdd);
$("#titleBtn").addEventListener("click",()=>{if(S.canEdit)showTitle()});
$("#moreBtn").addEventListener("click",()=>{if(S.canEdit)showMore();else toast("Mod tengok sahaja")});
$("#avatarBtn").addEventListener("click",()=>{if(S.canEdit)showMore()});
boot();
</script>
</body>
</html>
